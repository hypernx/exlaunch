name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y python3 python3-pip cmake make git
          dkp-pacman -S --noconfirm switch-tools || true
      - name: Build plugin
        run: make -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: splatoon3-plugin
          path: |
            deploy/subsdk9
            deploy/main.npdm
