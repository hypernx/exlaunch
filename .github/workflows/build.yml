name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y python3 python3-pip cmake make git
          dkp-pacman -S --noconfirm switch-tools || true
      - name: Build plugin
        run: make -j"$(nproc)"
      # モジュール先頭(+0:分岐, +4:MOD0, +8:SDKバージョン)の確認用
      - name: Show module header
        run: |
          $DEVKITPRO/devkitA64/bin/aarch64-none-elf-objdump -s --start-address=0 --stop-address=0x20 *.elf || true
      # SDカードのルートにそのまま貼り付けられる形にまとめる
      - name: Package for SD card
        run: |
          PROGRAM_ID=$(grep -E '^PROGRAM_ID' config.mk | sed -E 's/.*:= *//' | tr -d '[:space:]')
          DEST=sd/atmosphere/contents/${PROGRAM_ID}/exefs
          mkdir -p "$DEST"
          cp deploy/subsdk9 deploy/main.npdm "$DEST/"
          find sd -type f
      - uses: actions/upload-artifact@v4
        with:
          name: splatoon3-plugin
          path: sd/
