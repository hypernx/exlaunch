name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y python3 python3-pip cmake make git
          dkp-pacman -S --noconfirm switch-tools || true
      - name: Build imgui-xeno
        run: |
          git config --global --add safe.directory '*'
          # Splatoon 3 向けの修正(専用コマンドバッファで描画)を当てる
          git -C libs/imgui-xeno apply ../../patches/imgui-xeno.patch
          cmake -S libs/imgui-xeno -B libs/imgui-xeno/build \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/libs/imgui-xeno/cmake/toolchain.cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build libs/imgui-xeno/build -j"$(nproc)"
          ls -l libs/imgui-xeno/build/libimgui_xeno.a
      - name: Build plugin
        run: make -j"$(nproc)"
      # モジュール先頭(+0:分岐, +4:MOD0, +8:SDKバージョン)の確認用
      - name: Show module header
        run: |
          $DEVKITPRO/devkitA64/bin/aarch64-none-elf-objdump -s --start-address=0 --stop-address=0x20 *.elf || true
      # SDカードのルートにそのまま貼り付けられる形にまとめる
      - name: Package for SD card
        run: |
          PROGRAM_ID=$(grep -E '^PROGRAM_ID' config.mk | sed -E 's/.*:= *//' | tr -d '[:space:]')
          DEST=sd/atmosphere/contents/${PROGRAM_ID}/exefs
          mkdir -p "$DEST"
          cp deploy/subsdk9 deploy/main.npdm "$DEST/"
          find sd -type f
      - uses: actions/upload-artifact@v4
        with:
          name: splatoon3-plugin
          path: sd/
      # クラッシュ解析用(SDカードには入れない)
      - uses: actions/upload-artifact@v4
        with:
          name: debug-elf
          path: "*.elf"
      # ビルド結果を artifacts ブランチにも置く(チャットから直接受け取れるように)
      - name: Publish to artifacts branch
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          (cd sd && python3 -m zipfile -c ../out/splatoon3-plugin.zip atmosphere)
          cp *.elf out/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > out/COMMIT
          cd out
          git init -q
          git checkout -q -b artifacts
          git add .
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "build ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" artifacts
